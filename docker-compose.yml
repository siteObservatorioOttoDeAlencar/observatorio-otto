# Ambiente de desenvolvimento local.
#
# - postgres:   banco compartilhado (Payload usa o schema "public"; a FastAPI usa "observacoes").
# - api-python: FastAPI (http://localhost:8000).
#
# O CMS (cms/) NÃO roda aqui: rode `npm run dev` dentro de cms/ (http://localhost:3000).
# Em produção nada disto é usado: CMS e API rodam na Vercel e o banco é o Neon.

services:
  postgres:
    image: postgres:16-alpine
    container_name: observatorio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatorio}
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Executado só na primeira criação do volume (cria o schema da FastAPI).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-observatorio} -d ${POSTGRES_DB:-observatorio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-python:
    build:
      context: ./api_python
    container_name: observatorio-api-python
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-observatorio}:${POSTGRES_PASSWORD:-observatorio}@postgres:5432/${POSTGRES_DB:-observatorio}
      # O cms/ roda na máquina host (npm run dev), não em contêiner.
      CMS_URL: ${CMS_URL:-http://host.docker.internal:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./api_python:/app

volumes:
  postgres_data:
